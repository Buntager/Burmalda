<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍌 Банановый кликер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .window {
            background: #16213e;
            border-radius: 50px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 2px solid #0f3460;
            color: white;
            text-align: center;
        }
        .banana {
            font-size: 180px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }
        .banana:active {
            transform: scale(0.90);
        }
        .counter {
            font-size: 52px;
            font-weight: bold;
            color: #f1c40f;
            margin: 10px 0;
        }
        .multiplier-info {
            font-size: 22px;
            color: #aaa;
            margin: 5px 0;
        }
        input {
            width: 100%;
            padding: 18px;
            margin: 10px 0;
            border: none;
            border-radius: 50px;
            background: #0f3460;
            color: white;
            font-size: 20px;
            text-align: center;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-group button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-group button:active {
            transform: scale(0.95);
        }
        .btn-login {
            background: #f1c40f;
            color: #16213e;
        }
        .btn-login:active {
            background: #e67e22;
        }
        .btn-register {
            background: #2ecc71;
            color: #16213e;
        }
        .btn-register:active {
            background: #27ae60;
        }
        .error {
            color: #e74c3c;
            font-size: 16px;
            margin-top: 10px;
        }
        .shop {
            background: white;
            padding: 15px;
            border-radius: 25px;
            margin-top: 15px;
            color: #333;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .shop-item button {
            width: auto;
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            background: #f1c40f;
            font-weight: bold;
            cursor: pointer;
        }
        .shop-item button:disabled {
            background: #ccc;
            color: #666;
            cursor: not-allowed;
        }
        #message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            min-height: 40px;
            text-align: center;
        }
        .reset-btn {
            margin-top: 15px;
            padding: 16px;
            border: none;
            border-radius: 50px;
            background: #e74c3c;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .reset-btn:active {
            transform: scale(0.95);
        }
        #gameContainer {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div class="window" id="loginBox">
        <h1>🍌 ВХОД</h1>
        <input type="text" id="loginInput" placeholder="Логин" value="test_account_123">
        <input type="password" id="passwordInput" placeholder="Пароль" value="123">
        <div class="btn-group">
            <button class="btn-login" id="loginBtn">Войти</button>
            <button class="btn-register" id="registerBtn">Регистрация</button>
        </div>
        <div class="error" id="errorMsg"></div>
        <div id="message" style="margin-top:10px;"></div>
    </div>

    <!-- ИГРА -->
    <div class="window" id="gameContainer">
        <div class="banana" id="banana">🍌</div>
        <div class="counter" id="counter">0</div>
        <div class="multiplier-info" id="multiplierInfo">Множитель: ×1</div>
        <div id="userLabel" style="color:#aaa;">Игрок: —</div>
        <div class="shop">
            <h2>🏪 МАГАЗИН</h2>
            <div id="shopItems"></div>
        </div>
        <button class="reset-btn" id="resetBtn">🔄 Сбросить прогресс</button>
        <div id="message" style="margin-top:10px;"></div>
    </div>

    <script>
        // ============================================================
        // 1. ТЕСТОВЫЙ АККАУНТ (для входа без сервера)
        // ============================================================
        const localUsers = {
            "test_account_123": "123"
        };

        // ============================================================
        // 2. ДАННЫЕ ИГРЫ
        // ============================================================
        const upgradesData = [
            { id: 0, name: "Обычный кликер", multiplier: 1, price: 0 },
            { id: 1, name: "Серебряный триггер", multiplier: 2, price: 500 },
            { id: 2, name: "Золотой кликер", multiplier: 3, price: 1500 },
            { id: 3, name: "Платиновый кликер", multiplier: 5, price: 4000 },
            { id: 4, name: "Алмазный кликер", multiplier: 8, price: 10000 },
            { id: 5, name: "Изумрудный кликер", multiplier: 12, price: 25000 },
            { id: 6, name: "Космический кликер", multiplier: 20, price: 60000 },
            { id: 7, name: "Галактический кликер", multiplier: 35, price: 150000 },
            { id: 8, name: "Вселенский кликер", multiplier: 60, price: 400000 },
            { id: 9, name: "Абсолютный кликер", multiplier: 100, price: 1000000 }
        ];

        let currentUser = null;
        let currentUserData = {
            bananas: 0,
            upgrade_level: 0
        };

        // ============================================================
        // 3. ЭЛЕМЕНТЫ
        // ============================================================
        const loginInput = document.getElementById('loginInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const errorMsg = document.getElementById('errorMsg');
        const loginBox = document.getElementById('loginBox');
        const gameContainer = document.getElementById('gameContainer');
        const userLabel = document.getElementById('userLabel');
        const counterElement = document.getElementById('counter');
        const bananaElement = document.getElementById('banana');
        const multiplierInfo = document.getElementById('multiplierInfo');
        const shopItemsContainer = document.getElementById('shopItems');
        const resetBtn = document.getElementById('resetBtn');
        const messageEl = document.getElementById('message');

        function showMessage(text, isError = false) {
            messageEl.textContent = text;
            messageEl.style.color = isError ? '#e74c3c' : '#aaa';
            setTimeout(() => { messageEl.textContent = ''; }, 3000);
        }

        // ============================================================
        // 4. ВХОД (работает даже без сервера!)
        // ============================================================
        function doLogin() {
            // 🔥 ЯВНО берём значения из полей
            const login = document.getElementById('loginInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            if (!login || !password) {
                errorMsg.textContent = 'Заполни оба поля!';
                return;
            }

            // Проверяем локальный аккаунт
            if (localUsers[login] && localUsers[login] === password) {
                currentUser = login;
                currentUserData = { bananas: 0, upgrade_level: 0 };
                loginBox.style.display = 'none';
                gameContainer.style.display = 'block';
                userLabel.textContent = 'Игрок: ' + login;
                updateUI();
                startGame();
                errorMsg.textContent = '';
                showMessage('✅ Вход выполнен! (локальный аккаунт)', false);
                return;
            }

            errorMsg.textContent = '❌ Неверный логин или пароль!';
        }

        // ============================================================
        // 5. ИГРА
        // ============================================================
        function updateUI() {
            counterElement.textContent = currentUserData.bananas;
            const upgrade = upgradesData[currentUserData.upgrade_level];
            multiplierInfo.textContent = 'Множитель: ×' + upgrade.multiplier;
            renderShop();
        }

        function addBananas(amount) {
            currentUserData.bananas += amount;
            updateUI();
            localStorage.setItem('banana_' + currentUser, JSON.stringify(currentUserData));
        }

        function buyUpgrade(upgradeId) {
            const upgrade = upgradesData[upgradeId];
            const currentId = currentUserData.upgrade_level;
            if (upgradeId !== currentId + 1) {
                showMessage('Сначала купи предыдущее!', true);
                return;
            }
            if (currentUserData.bananas < upgrade.price) {
                showMessage('Не хватает бананов! Нужно: ' + upgrade.price, true);
                return;
            }
            currentUserData.bananas -= upgrade.price;
            currentUserData.upgrade_level = upgradeId;
            updateUI();
            localStorage.setItem('banana_' + currentUser, JSON.stringify(currentUserData));
            showMessage('🎉 Ты купил: ' + upgrade.name + '!');
        }

        function renderShop() {
            const currentId = currentUserData.upgrade_level;
            const nextId = currentId + 1;
            let html = '';
            if (nextId < upgradesData.length) {
                const upgrade = upgradesData[nextId];
                const canAfford = currentUserData.bananas >= upgrade.price;
                html += `<div class="shop-item">
                            <div>
                                <div class="name">${upgrade.name}</div>
                                <div style="font-size:14px;color:#888;">💰 ${upgrade.price} бананов, ×${upgrade.multiplier}</div>
                            </div>
                            <button onclick="buyUpgrade(${upgrade.id})" ${!canAfford ? 'disabled' : ''}>
                                Купить
                            </button>
                        </div>`;
            } else {
                html = '<p style="text-align:center;color:#888;">🏆 Ты достиг максимума!</p>';
            }
            shopItemsContainer.innerHTML = html;
        }

        function resetGame() {
            if (confirm('Точно сбросить прогресс?')) {
                currentUserData.bananas = 0;
                currentUserData.upgrade_level = 0;
                updateUI();
                localStorage.setItem('banana_' + currentUser, JSON.stringify(currentUserData));
                showMessage('Прогресс сброшен!');
            }
        }

        function startGame() {
            // Восстанавливаем сохранённые данные
            const saved = localStorage.getItem('banana_' + currentUser);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.bananas !== undefined) currentUserData.bananas = data.bananas;
                    if (data.upgrade_level !== undefined) currentUserData.upgrade_level = data.upgrade_level;
                    updateUI();
                } catch (e) {}
            }

            // Убираем старые обработчики, чтобы не дублировать
            bananaElement.replaceWith(bananaElement.cloneNode(true));
            const newBanana = document.getElementById('banana');
            newBanana.addEventListener('click', function() {
                const upgrade = upgradesData[currentUserData.upgrade_level];
                addBananas(upgrade.multiplier);
            });

            resetBtn.addEventListener('click', resetGame);
        }

        // ============================================================
        // 6. ПРИВЯЗКА КНОПОК (гарантированно работает)
        // ============================================================
        loginBtn.onclick = doLogin;
        registerBtn.onclick = function() {
            errorMsg.textContent = '⚠️ Регистрация пока только через сервер.';
        };

        // Вход по Enter
        passwordInput.onkeydown = function(e) {
            if (e.key === 'Enter') doLogin();
        };
        loginInput.onkeydown = function(e) {
            if (e.key === 'Enter') doLogin();
        };

        // ============================================================
        // 7. ЗАГРУЗКА (для отладки)
        // ============================================================
        console.log('✅ Страница загружена! Кнопка "Войти" привязана.');
    </script>

</body>
</html>
